[f_imaxe]
<div class="trw-form-1"> Aquí puedes editar y cargar tus imágenes de manera rápida y sencilla. </div>
<fieldset class="fset-editor">
<legend class="editor_legend fset-editor__legend"> Propiedades </legend> 
<div class="ceditor-imx">
  <div class="img-thumb">
    <div class="img-thumb__img">[imaxe]</div>
    [imx_prop]
  </div>
  <div class="">[imx_cambiar]</div>
</div>
</fieldset>
<fieldset class="fset-editor">
  <legend class="editor_legend fset-editor__legend"> Editor </legend>   

    <div class="trw-form-1">
      <div>[cstyle]</div>
    </div>
    <div class="trw-form-1">
      <label>Texto en pie de foto</label>
      [titulo]
    </div>

    <div class="trw-form-1">
      <label>Etiqueta (alt)</label>
      [tadesc]
    </div>

    <div class="trw-form-2a" style="grid-template-columns: 67% auto;">
      <div class="trw-form-1">
        <label>Enlace</label>
        [link_href]
      </div>

      <div class="trw-form-1">
        <label>Abrir en</label>
        [link_target]
      </div>
    </div>
</fieldset>
