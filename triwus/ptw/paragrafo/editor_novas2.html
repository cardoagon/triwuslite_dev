<!-- Editor noticia -->
<div class="trw-form-1"> Aquí puedes editar y cargar tus noticias de manera rápida y sencilla.</div>
[f_imaxe][hcrop]

  <fieldset class="fset-editor">
  <legend class="editor_legend fset-editor__legend"> Básico </legend> 
    <div class="ceditor-imx">
      <div class="img-thumb field--column">
        <div class="img-thumb__img">[imaxe]</div>
        [imx_cambiar]
      </div>
    </div>

    <div class="trw-form-1">
      <label>Título</label>
        [tnome] 
    </div>
    <div class="trw-form-1">
      <label>Entradilla</label>
        [tnotas]
    </div>

    <div class="trw-form-2b">
      <div class="trw-form-1">
        <label>Fecha</label>
          [tdata]
      </div>
      <div></div>
    </div>
  </fieldset>

  <fieldset class="fset-editor">
  <legend class="editor_legend fset-editor__legend"> Publicación </legend> 
    <div class="trw-form-3c" style="grid-template-columns: 7em auto 11em;">
      <div class="trw-form-1">
        <label>Publicar</label>
        [chpub]
      </div>
      <div class="trw-form-1">
        <label>Fecha y hora</label>
        <div class="trw-form-2a" style="grid-template-columns: 71% auto;">
          <div>[tdatapub]</div>
          <div>[thorapub]</div>
        </div>  
      </div>  
      <div class="trw-form-1">
        <label>Permiso</label>
        [tgrupo]
      </div>
    </div>  
  </fieldset>

  <fieldset class="fset-editor">
    <legend class="editor_legend fset-editor__legend"> Etiquetas ( buscador )</legend>

    <div class="trw-form-1">
      <label>Nivel 1</label>
      [tetq_1]
    </div>
    <div class="trw-form-1">
      <label>Nivel 2</label>
      [tetq_2]
    </div>
    <div class="trw-form-1">
      <label>Nivel 3</label>
      [tetq_3]
    </div>
  </fieldset>
  
[cn2_enlace]
