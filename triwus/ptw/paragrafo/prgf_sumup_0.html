var SumUpCard;

function trw_sumup_ini(checkoutId) {
console.log('SumUp JS iniciado.');
  SumUpCard.mount({
    id: "sumup-card",
    showFooter: false,
    checkoutId: checkoutId,
    country: "ES",
    currency: "EUR",
    locale: "es-ES",
    onResponse: async function (type, body) {      
      //~ await sumup_enviar_resposta(type, body)
      console.log("Type", type);
      console.log("Body", body);
    },
  });
}

async function sumup_enviar_resposta(type, body) {
  console.log("Type", type);
  console.log("Body", body);
  
  var formData = new FormData();

  formData.append("findex;evento", sumup_evento()); 
  //~ formData.append("sumup_op"     , 'set'); 
  //~ formData.append("order_id"     , orderID        ); 

  const o_fetch = {method: 'POST',
                   body  : formData
                  };

//~ console.log(o_fetch);
  const resposta = await fetch(`${document.forms[0].action}?ajax=1`, o_fetch);

  if ( !resposta.ok ) {
    throw "ERRO. sumup_enviar_resposta(). ( !resposta.ok ).";

    return;
  }

}

function sumup_evento() {
  return document.querySelector("[sumup_evento]").id + csubnome + "tipo=onclick" + csubnome + "ajax=1";
}
