[f_imaxe][paux]
<div class="epanoramix">
  <div class="epanoramix__field" style="padding-top: 0; align-items: center;">
    <div class="epanoramix__img">[imaxe]</div>
    <div class="ceditor-imx__link">[imx_cambiar]</div>
  </div>
  <div>
    <div class="trw-form-1">
      <label>Texto sobre la imagen</label>
      [ttxt]
    </div>

    <div class="trw-form-1">
      <label>Asignar &lt;H1&gt</label>
      [chH1] <!-- tiene asignado un label en php -->
    </div>

    <div class="trw-form-1">
      <label>Color de texto</label>
      [scolor]
    </div> 

    <div class="trw-form-2a" style="grid-template-columns: 67% auto;">
        <div class="trw-form-1">
          <label>Enlace</label> 
         [link_href]
        </div>
        
        <div class="trw-form-1">
          <label>Abrir en</label>
           [link_target]
        </div>
    </div>
  </div>
</div>
