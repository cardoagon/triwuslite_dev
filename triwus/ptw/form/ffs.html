  function trw_pcontrol_tenda_ico_ini() {
    var p0 = null;
    var x0 = document.getElementById("findex;btenda_0");

    if (x0 == null) return;
    
    if (x0.style.display != "none") return;


    var p0 = x0.parentNode; p0.parentNode.removeChild(p0);

    var p1 = x1.parentNode; p1.parentNode.removeChild(p1);
  }
