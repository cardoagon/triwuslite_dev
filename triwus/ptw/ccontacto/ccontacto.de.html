<fieldset class='fieldset_2'>
  <legend>Kontaktinformationen</legend>

  <div class="trw-form-3a2" style="margin-top: 2.3em;">
    <div class="trw-form-1">
      <label>Kontaktart</label>
      [stipo]
    </div>
  </div>
  
  <div class="trw-form-3a2" style="margin-top: 1.7em;">
    <div class="trw-form-1">
      <label>[pasterisco*cnif_d]USt-IdNr/ Ust-Nr</label>
      [cnif_d]
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*nome]Vorname</label>
      [nome]
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*razon_social]Firmenname</label>
      [razon_social]
    </div>
  </div>
  
  <div class="trw-form-3a2" style="margin-top: 0">
    <div class="trw-form-1">
      <label>[pasterisco*email]E-Mail</label>

    </div>
    <div class="trw-form-1">
      <label>[pasterisco*mobil]Telefon Nr. 1</label>
      <div class="trw_pcontrol__tlfn">
        <span class="trw_pcontrol__tlfn--prefijo">[mobil_p0]</span>[mobil]
      </div>
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*tlfn]Telefon Nr. 2</label>
      <div class="trw_pcontrol__tlfn">
        <span class="trw_pcontrol__tlfn--prefijo">[tlfn_p0]</span>[tlfn]

    </div>
  </div>


  [cenderezo]
</fieldset>
