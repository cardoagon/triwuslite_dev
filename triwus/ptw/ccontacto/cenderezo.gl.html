<fieldset class="fieldset_3" style="margin-top: 1.3em;">
  <legend>Dirección Postal</legend>

  <div class="trw-form-2a" style="margin-top: 0.3em; grid-template-columns: 24% 75%; gap: 1%;">
    <div class="trw-form-1">
      <label>[pasterisco*codtipovia]Tipo de via</label>
      [codtipovia]
      <small class="form__help"></small>
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*via]Nome da vía</label>
      [via]
    </div>
  </div>

  <div class="trw-form-2a">
    <div class="trw-form-2b">
      <div class="trw-form-1">
        <label>[pasterisco*num]Num</label>
        [num]
      </div>
      <div class="trw-form-1">
        <label>&hellip;</label>
        [resto]
      </div>
    </div>
    <div class="trw-form-2b">
      <div class="trw-form-1">
        <label>[pasterisco*cp]Cod. postal</label>
        [cp]
      </div>
      <div class="trw-form-1">
        <label>[pasterisco*localidade]Localidade</label>
        [localidade]
      </div>
    </div>
  </div>
</fieldset>
