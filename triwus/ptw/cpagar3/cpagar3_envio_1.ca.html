<!-- info-envio -->
  <div class="lista_carro_aux_1 cpagar3_info-envio-container">
    <div class="cpagar3_titulo">Informació de destí</div>
    <div class="cpagar3_info">Els camps marcats amb (*) són obligatoris.</div>

    <div class="cpagar3_grid-info-envio">
      <div class="cpagar3_nombre">
          <label class="cpagar3_requerido">Nom i cognoms</label>
          [nome]
      </div>

      <div class="cpagar3_dni">
        <label>[ast_cnife] CIF / NIF / NIE</label>
        [cnif_d]
        <span class="cpagar3_nota">Necessari si desitges sol·licitar factura</span>
      </div>

      <div class="cpagar3_razon-social">
        <label>Raó Social</label>
        [razon_social]
      </div>

      <div class="cpagar3_telefono">
        <label>[ast_tlfn] Telèfon</label>
          <div class="cpagar3_fila-telefono">
            <div class="cpagar3_fila-telefono-pre">[mobil_p0]</div>
            <div class="cpagar3_fila-telefono-num">[mobil]</div>
          </div>
      </div>

      <div class="cpagar3_mail">
        <label class="cpagar3_requerido">Correu electrònic</label>
        [email]
      </div>


      <div class="cpagar3_enderezo-container cpagar3_erros">
       <div class="cpagar3_msx-erros">[paviso][perro]</div>
      </div>

      <div class="cpagar3_observaciones">
        <label>Observacions</label>
        [cprefservizo]
      </div>
    </div>
 </div>
