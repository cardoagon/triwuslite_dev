[tipo][id_oms][id_pax][id3]
<div>

  <fieldset>
    <legend class="pcontrol_legend">Propiedades básicas</legend>
    <div class="trw-form-2a" style="margin-top:1em;">
      <div class="trw-form-1">
        <label>Nombre</label>[nome]
      </div>
      <div class="trw-form-2a">
        <div class="trw-form-1">
          <label>Idioma</label>[sidioma]
        </div>
        <div class="trw-form-1">
          <label>Permisos</label>[grupo]
        </div>
     </div>
    </div>
  </fieldset>


  <fieldset>
    <legend class="pcontrol_legend">Publicación</legend>
    <div class="trw-form-2a" style="margin-top:1em;">
      <div class="trw-form-3b">
        <div class="trw-form-1">[estado]</div>
        <div class="trw-form-1">[tdatapub]</div>
        <div class="trw-form-1" style="width: 5em;">[thorapub]</div>
      </div>
      <div class="trw-form-2a" style="display: flex; gap:1.5em">
        <div class="trw-form-1">[visible]</div>
        <div class="trw-form-1">[puente]</div>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend class="pcontrol_legend">Otras propiedades</legend>
    <div class="trw_pcontrol_form_1">
      <div style="flex-grow: 0.1">[cprops]</div>
    </div>
  </fieldset>
</div>
