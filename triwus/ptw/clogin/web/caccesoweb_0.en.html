<div class="trw-login-caixa-marco">

  <!-- header -->
  <div class="trw-login-caixa-titulo">Sign in</div>
  <div class="trw-login-caixa-info">Enter your credentials to access the service.</div>
 
  <!-- content -->
  <div class="trw-login-caixa-form">
    <div class="trw-login-caixa-form__field">
      <label class="trw-login-caixa-form__label">Email</label>
      [email]
    </div>
    
    <div class="trw-login-caixa-form__field">
      <label class="trw-login-caixa-form__label">Password</label>
      [contrasinal]
    </div>

    <span class="trw-login-lembrar">[cambiak]</span>

    <div class="trw-login-caixa-form__field trw-login-caixa-form__field--boton">
      [bAceptar]
      <div class="trw-login-caixa-form__checkbox">
        <span class="trw-checkbox">[chkcookie]</span>
      </div>
    </div>
  </div>

  <!-- footer -->

</div>
