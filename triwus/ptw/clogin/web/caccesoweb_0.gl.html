<div class="trw-login-caixa-marco">
  <!-- header -->
  <div class="trw-login-caixa-titulo">Acceso</div>
  <div class="trw-login-caixa-info">Introduce as túas credenciais para acceder ao servizo.</div>

  <!-- content -->
  <div class="trw-login-caixa-form">
    <div class="trw-login-caixa-form__field">
      <label class="trw-login-caixa-form__label">Correo electrónico</label>
      [email]
    </div>

    <div class="trw-login-caixa-form__field">
      <label class="trw-login-caixa-form__label">Contrasinal</label>
      [contrasinal]
    </div>

    <span class="trw-login-lembrar">[cambiak]</span>

    <div class="trw-login-caixa-form__field trw-login-caixa-form__field--boton">
      [bAceptar]
      <div class="trw-login-caixa-form__checkbox">
        <span class="trw-checkbox">[chkcookie]</span>
      </div>
    </div>
  </div>
  
</div>
