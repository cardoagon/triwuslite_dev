<div class="trw-login-caixa-marco">
  <!-- header -->
  <div class="trw-login-caixa-titulo">Mein Konto</div>
  <div class="trw-login-caixa-info">Geben Sie Ihre Anmeldedaten ein, um auf den Dienst zuzugreifen.</div>

  <!-- content -->
  <div class="trw-login-caixa-form">
    <div class="trw-login-caixa-form__field">
      <label class="trw-login-caixa-form__label">E-Mail</label>
      [email]
    </div>

    <div class="trw-login-caixa-form__field">
      <label class="trw-login-caixa-form__label">Passwort</label>
      [contrasinal]
    </div>

    <span class="trw-login-lembrar">[cambiak]</span>

    <div class="trw-login-caixa-form__field trw-login-caixa-form__field--boton">
      [bAceptar]
      <div class="trw-login-caixa-form__checkbox">
        <span class="trw-checkbox">[chkcookie]</span>
      </div>
    </div>
  </div>
  
</div>
