<script>
  var invitacion_text_focus = 0;
  
  function invitacion_td_to_click() {
    if (invitacion_text_focus == 1) return;
    
    document.getElementById("findex;fs_confirm;to").focus();
    
    document.getElementById("invitacion_to_td").style.border = "1px solid #8cc63f";
    
    invitacion_text_focus = 1;
  }
  
  function invitacion_td_from_click() {
    if (invitacion_text_focus == 2) return;
    
    document.getElementById("findex;fs_confirm;from").focus();
    
    document.getElementById("invitacion_from_td").style.border = "1px solid #8cc63f";
    
    invitacion_text_focus = 2;
  }
  
  function invitacion_text_blur(i) {
    text_focus = 0;
    
    if (i == 1) {
      document.getElementById("invitacion_to_td").style.border = "1px solid transparent";
      
      return;
    }
    
    if (i == 2) {
      document.getElementById("invitacion_from_td").style.border = "1px solid transparent";
      
      return;
    }
  }
  
</script>

  </tr>
  
  <tr>
