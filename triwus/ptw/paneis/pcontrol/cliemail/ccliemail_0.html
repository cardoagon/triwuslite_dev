<div class="pcontrol_panel">
  <div>
    <div class="titulo1">Cliente SMTP</div>
    <hr size="2" color="#000000"/>
    <div class="subtitulo2">Configura un cliente de correo SMTP para el envío de emails desde tu site.</div>
  </div>

  <fieldset>
    <legend></legend>
    <div class="trw-form-3a1">
      <div class="trw-form-1">
        <label>* Servidor</label>
        [cm_url]
      </div>

      <div class="trw-form-1">
        <label>* Seguridad</label>
        [cm_seguridad]
      </div>

      <div class="trw-form-1">
        <label>* Puerto</label>
        [cm_puerto]
      </div>
    </div>

    <div class="trw-form-3a1">
      <div class="trw-form-1">
        <label>* Usuario</label>
        [cm_email]
      </div>
      <div class="trw-form-1">
        <label>* Contraseña</label>
        [cm_k]
      </div>
      <div class="trw-form-1">
        <label for="">Nombre</label>
        [cm_nombre]
      </div>
    </div>
    <div style="display:flex;gap:1.5em;margin-top: 2em">[bCancelar] [bAceptar]</div>

  </fieldset>

  

</div>
