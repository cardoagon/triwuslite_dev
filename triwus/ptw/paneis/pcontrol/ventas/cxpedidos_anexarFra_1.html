      Anexar factura del pedido: <b>[pedido]</b>.

      [fpdf]

      <fieldset class="fieldset_2">

        <div class="trw_pcontrol_form_1">

          <div style='flex-grow: 1;'>
            <label>* #Factura</label>[fraref]
          </div>
-->
          <div style='flex-grow: 0;'>
            <label>&nbsp;</label><div style='display: flex; gap: 0.3em;'>[bsubir]</div>
          </div>
        </div>

    </div>
    <div class="trw-modal__footer">
      <div class="trw-modal__buttons">[bCancelar]</div>
    </div>
  </div>
