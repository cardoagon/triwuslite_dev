<div class="trw-pcontrol-backdrop">
  <div class="trw-pcontrol-modal" style="width: 33%;">
    <div class="trw-pcontrol-modal__header">
      <span class="pcontrol_vm_bpechar" bpecha_id="findex;cpromos;cpromosf;bCancelar" onclick="pcontrol_vm_bpechar(this)">✕</span>
      Ficha de promoción
    </div>
    <div class="trw-pcontrol-modal__content">
      <div style="padding: 1.3em 0.7em;">
        <div class="trw-form-1">
          <label for="">Nombre</label>
          [nome]
        </div>
        
        <div class="trw-form-2b">
          <div class="trw-form-1">
            <label for="">Inicio</label>
            [data_ini]
          </div>
          <div class="trw-form-1">
            <label for="">Fin</label>
            [data_fin]
          </div>
        </div>
        
        <div class="trw-form-2b">
          <div class="trw-form-1">
            <label for="">Tipo</label>
            [stipo]
          </div>
          <div class="trw-form-1">
            <label for="">Compra min. <small>(&euro;)</small></label>
            [compra_min]
          </div>
        </div>
            
        <div class="trw-form-2b">
          <div class="trw-form-1">
            <label for="">Dto.</label>
            [dto]
          </div>
          <div class="trw-form-1">
            <label for="">Tipo dto.</label>
            [stipoDesc]
          </div>
        </div>
       
        <div class="trw-form-2b">
          <div class="trw-form-1">
            <label for="">Código</label>
            [codigo]
          </div>
          <div class="trw-form-1">
            <label for="">&nbsp;</label>
            [lcodigo]
          </div>
        </div>
      </div>
    </div>
    <div class="trw-pcontrol-modal__footer">
      <div class="trw-pcontrol-modal__buttons">[bCancelar] [bAceptar]</div>
    </div>
  </div>
</div>
