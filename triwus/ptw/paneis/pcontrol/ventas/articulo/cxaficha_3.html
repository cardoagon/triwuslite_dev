<div class="trw-pcontrol-backdrop">
  <div class='trw-pcontrol-modal'>
  
    <div class="trw-pcontrol-modal__header">
      <span class= "pcontrol_vm_bpechar"
            bpecha_id = "findex;cxarticulos;cxaf;bCancelar"
            onclick   = "pcontrol_vm_bpechar(this)">✕</span>
      Alta de producto
    </div>

    <div class="trw-pcontrol-modal__content">
      <div class="trw_pcontrol_form_0">
        <div class="trw_pcontrol_form_1">
          <div class="trw-form-1" style="width: 27%;">
            <label>Tipo de producto</label>[stipo]
          </div>
          <div class="trw-form-1" style="width: 73%;">
            <label>Nombre</label>[nome]
          </div>
        </div>

        <div class="trw_pcontrol_form_1">
          <div class="trw-form-1" style="width: 100%;">
            <label>Descripción</label>[notas]
          </div>
        </div>
      </div>
    </div>

    <div class="trw-pcontrol-modal__footer">
      <div class="trw-pcontrol-modal__buttons">
        [bCancelar]
        [bAceptar]
      </div>
    </div>
  
  </div>
</div>
