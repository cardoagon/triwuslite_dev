<fieldset class='fieldset_2'>
  <legend>Datos del almacén</legend>
  
  <div class="trw-form-3a2" style="margin-top: 1.7em;">
    <div class="trw-form-1">
      <label>[pasterisco*cnif_d]CIF/NIF/NIE</label>
      [cnif_d]
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*nome]Nombre</label>
      [nome]
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*razon_social]Razón social</label>
      [razon_social]
    </div>
  </div>
  
  <div class="trw-form-3a2" style="margin-top: 0">
    <div class="trw-form-1">
      <label>[pasterisco*email]Email</label>
      [email]
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*mobil]Tlfn-1</label>
      <div class="trw_pcontrol__tlfn">
        <span class="trw_pcontrol__tlfn--prefijo">[mobil_p0]</span>[mobil]
      </div>
    </div>
    <div class="trw-form-1">
      <label>[pasterisco*tlfn]Tlfn-2</label>
      <div class="trw_pcontrol__tlfn">
        <span class="trw_pcontrol__tlfn--prefijo">[tlfn_p0]</span>[tlfn]
      </div>
    </div>
  </div>
  
  <div class="trw-form-1">
    <label>[pasterisco*notas]Descripción</label>
    [atnotas]
  </div>

  [cenderezo]
  
  <div class="trw-form-1" style="margin: 1.7em 0;">
    <label>[pasterisco*url]Logotipo</label>
    <div style="width:10em;">[logo]</div>
  </div>
</fieldset>
