<fieldset>
  <legend>Instalador de triwus</legend>


    <div class="trw-form-1">
      Este instalador permite realizar la configuración de un site, a partir de una copia de seguridad.
    </div>

    <!-- básico -->
    <fieldset>
      <legend>Referencias</legend>

      <div class="trw-form-1">
        ...
      </div>

      <div class="trw-form-2a">
        <div class="trw-form-2a">
          <div class="trw-form-1">
            <label>Dominio</label>
            [dominio]
          </div>
          <div class="trw-form-1">
            <label>Carpeta de instalación</label>
            [pwd]
          </div>
        </div>
        <div class="trw-form-2a">
          <div class="trw-form-1">
            <label>Carpeta privada</label>
            [pri]
          </div>
        </div>
      </div>
    </fieldset>

    <!-- BD -->
    <fieldset>
      <legend>BD (mariadb)</legend>

      <div class="trw-form-1">
        Teclea los parámetros de acceso a la BD.
      </div>

      <div class="trw-form-2a">
        <div class="trw-form-2a">
          <div class="trw-form-1">
            <label>Host</label>
            [host]
          </div>
          <div class="trw-form-1">
            <label>BD</label>
            [bd]
          </div>
        </div>
        <div class="trw-form-2a">
          <div class="trw-form-1">
            <label>Usuario</label>
            [bd_u]
          </div>
          <div class="trw-form-1">
            <label>Contrasinal</label>
            [bd_k]
          </div>
        </div>
      </div>
    </fieldset>

    <!-- botonera -->
    <div style="padding: 1.3em auto">
      [bAceptar]
    </div>


</fieldset>
